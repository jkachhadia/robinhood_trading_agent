[project]
name = "tradeagent"
version = "0.1.0"
description = "Enforcement, journaling and approval layer for a Claude Code agent trading through Robinhood's Agentic Trading MCP"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6",
    "rich>=13",
]

[project.scripts]
tradeagent = "tradeagent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "freezegun>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tradeagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
